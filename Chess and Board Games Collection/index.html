<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棋类游戏合集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
            font-size: 2.5em;
        }

        #menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .game-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 30px;
            border-radius: 15px;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            font-weight: bold;
        }

        .game-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        #game-container {
            display: none;
        }

        #game-container.active {
            display: block;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .game-title {
            font-size: 1.8em;
            color: #333;
        }

        .game-info {
            font-size: 1.2em;
            color: #666;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .back-btn {
            background: #95a5a6;
            color: white;
        }

        .back-btn:hover {
            background: #7f8c8d;
        }

        .undo-btn {
            background: #f39c12;
            color: white;
        }

        .undo-btn:hover {
            background: #e67e22;
        }

        .reset-btn {
            background: #e74c3c;
            color: white;
        }

        .reset-btn:hover {
            background: #c0392b;
        }

        .flip-btn {
            background: #9b59b6;
            color: white;
        }

        .flip-btn:hover {
            background: #8e44ad;
        }

        .pass-btn {
            background: #16a085;
            color: white;
        }

        .pass-btn:hover {
            background: #138d75;
        }

        .score-btn {
            background: #2980b9;
            color: white;
        }

        .score-btn:hover {
            background: #21618c;
        }

        .options {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1em;
            color: #333;
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        #board {
            display: inline-block;
            margin: 20px auto;
            position: relative;
            transition: transform 0.6s ease;
        }

        #board.flipped {
            transform: rotate(180deg);
        }

        .board-wrapper {
            text-align: center;
        }

        canvas {
            border: 2px solid #333;
            background: #f5deb3;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .message {
            text-align: center;
            margin-top: 20px;
            font-size: 1.3em;
            color: #e74c3c;
            font-weight: bold;
        }

        .score-display {
            text-align: center;
            margin-top: 15px;
            padding: 15px;
            background: #ecf0f1;
            border-radius: 8px;
            font-size: 1.1em;
            color: #2c3e50;
        }

        .score-display strong {
            color: #e74c3c;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .game-btn {
                padding: 20px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>棋类游戏合集</h1>
        
        <div id="menu">
            <button class="game-btn" onclick="startGame('chinese-chess')">中国象棋</button>
            <button class="game-btn" onclick="startGame('chess')">国际象棋</button>
            <button class="game-btn" onclick="startGame('gomoku')">五子棋</button>
            <button class="game-btn" onclick="startGame('tictactoe')">井字棋</button>
            <button class="game-btn" onclick="startGame('go-19')">19×19围棋</button>
            <button class="game-btn" onclick="startGame('go-13')">13×13围棋</button>
            <button class="game-btn" onclick="startGame('go-9')">9×9围棋</button>
        </div>

        <div id="game-container">
            <div class="game-header">
                <h2 class="game-title" id="game-title"></h2>
                <div class="game-info" id="game-info"></div>
                <div class="controls">
                    <button class="control-btn back-btn" onclick="backToMenu()">返回菜单</button>
                    <button class="control-btn undo-btn" onclick="undo()">悔棋</button>
                    <button class="control-btn reset-btn" onclick="resetGame()">重新开始</button>
                    <button class="control-btn flip-btn" id="flip-btn" onclick="flipBoard()" style="display:none;">翻转棋盘</button>
                    <button class="control-btn pass-btn" id="pass-btn" onclick="passMove()" style="display:none;">虚手</button>
                    <button class="control-btn score-btn" id="score-btn" onclick="calculateScore()" style="display:none;">结算</button>
                </div>
            </div>
            
            <div class="options" id="options" style="display:none;">
                <label class="checkbox-label">
                    <input type="checkbox" id="auto-flip" onchange="toggleAutoFlip()">
                    <span>自动翻转棋盘</span>
                </label>
            </div>
            
            <div class="board-wrapper">
                <canvas id="board"></canvas>
            </div>
            
            <div class="message" id="message"></div>
            <div class="score-display" id="score-display" style="display:none;"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
